name: Windows APK build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/windows-build.yml"
      - "app/**"
      - "mk15-sdk/**"
      - "host-tests/**"
      - "tools/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "BUILD_WINDOWS.bat"
      - "RUN_PROTOCOL_SELFTEST.bat"
      - "PUBLISH_LAST_RUN.bat"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mk15-windows-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cf-windows]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Windows PowerShell 5.1 script syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path "tools" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host ("PowerShell parse errors in " + $_.FullName)
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;28.2.13676358"

      - name: Build native UART
        shell: powershell
        run: |
          .\tools\build_native_windows.ps1 -SdkRoot $env:ANDROID_SDK_ROOT -NdkVersion "28.2.13676358"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: SIYI protocol self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".host-test-build" | Out-Null
          javac -encoding UTF-8 -d ".host-test-build" "app/src/main/java/com/mk15/portinspector/SiyiProtocol.java" "app/src/main/java/com/mk15/portinspector/ProbeDiffEngine.java" "app/src/main/java/com/mk15/portinspector/ReportTools.java" "app/src/main/java/com/mk15/portinspector/ChannelActivityTracker.java" "app/src/main/java/com/mk15/portinspector/HardwareControlsResearch.java" "mk15-sdk/src/main/java/com/mk15/sdk/Mk15Protocol.java" "mk15-sdk/src/main/java/com/mk15/sdk/Mk15Evidence.java" "host-tests/ProtocolSelfTest.java" "host-tests/ProbeDiffSelfTest.java" "host-tests/ReportToolsSelfTest.java" "host-tests/ChannelActivityTrackerSelfTest.java" "host-tests/Mk15SdkSelfTest.java" "host-tests/HardwareControlsResearchSelfTest.java"
          java -cp ".host-test-build" ProtocolSelfTest
          java -cp ".host-test-build" ProbeDiffSelfTest
          java -cp ".host-test-build" ReportToolsSelfTest
          java -cp ".host-test-build" ChannelActivityTrackerSelfTest
          java -cp ".host-test-build" Mk15SdkSelfTest
          java -cp ".host-test-build" HardwareControlsResearchSelfTest

      - name: Build debug APK
        shell: pwsh
        run: |
          gradle :app:assembleDebug :mk15-sdk:assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          Copy-Item "app/build/outputs/apk/debug/app-debug.apk" "out/MK15PortInspector-1.5.5-debug.apk"
          Copy-Item "mk15-sdk/build/outputs/aar/mk15-sdk-release.aar" "out/MK15-CD-SDK-1.0.0.aar"
          Get-FileHash -Algorithm SHA256 "out/MK15PortInspector-1.5.5-debug.apk","out/MK15-CD-SDK-1.0.0.aar" | Format-List | Out-File "out/SHA256.txt"

      - name: Upload APK (best effort; build remains authoritative)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MK15-Port-Inspector-1.5.5-and-CD-SDK
          path: |
            out/MK15PortInspector-1.5.5-debug.apk
            out/MK15-CD-SDK-1.0.0.aar
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 3
