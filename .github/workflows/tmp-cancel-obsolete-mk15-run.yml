name: Cancel obsolete MK15 analysis run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cancel-obsolete-mk15-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: [self-hosted, cf-online]
    timeout-minutes: 2
    steps:
      - name: Cancel exact obsolete queued run only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          owner='creative-force-team'
          repo='SIYI-MK15-Port-Inspector'
          run_id=37390881527
          base=f'https://api.github.com/repos/{owner}/{repo}'
          headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'
          }
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return json.load(r)
          run=get('/actions/runs/'+str(run_id))
          print('RUN',run_id,run.get('name'),run.get('status'),run.get('conclusion'))
          if run.get('name')!='Analyze SIYI reports 2026-10-06':
              raise SystemExit('refusing: workflow identity changed')
          if run.get('status')=='completed':
              print('ALREADY_COMPLETED')
              raise SystemExit(0)
          jobs=get('/actions/runs/'+str(run_id)+'/jobs').get('jobs',[])
          if any(j.get('status')=='in_progress' for j in jobs):
              raise SystemExit('refusing: obsolete run already executing')
          req=urllib.request.Request(
              base+'/actions/runs/'+str(run_id)+'/cancel',
              data=b'',
              headers=headers,
              method='POST')
          with urllib.request.urlopen(req,timeout=15) as r:
              print('CANCEL_HTTP',r.status)
          PY
